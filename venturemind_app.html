// FULL PIPELINE -- orchestrates modules 1-8, mirrors VentureMindPipeline.run
// ===========================================================================
let CACHED_ALL_OPPORTUNITIES = null;
let CACHED_RISK_MODEL = null;
function getAllOpportunities() {
  if (!CACHED_ALL_OPPORTUNITIES) CACHED_ALL_OPPORTUNITIES = buildOpportunities();
  return CACHED_ALL_OPPORTUNITIES;
}
function getRiskModel() {
  if (!CACHED_RISK_MODEL) CACHED_RISK_MODEL = buildRiskModel(getAllOpportunities());
  return CACHED_RISK_MODEL;
}

function runPipeline(rawInputs, opts) {
  const fast = !!(opts && opts.fast);
  const founder = buildFounderProfile(rawInputs);
  const founderState = resolveFounderState(founder.location);
  const warnings = founder.warnings.slice();
  if (founderState === null)
    warnings.push(`Could not match location '${founder.location}' to a known state -- location affinity will be neutral (0.5) for every opportunity.`);

  let candidates = founder.interests.length
    ? getAllOpportunities().filter((o) => founder.interests.includes(o.sector))
    : getAllOpportunities();
  if (!candidates.length) candidates = getAllOpportunities();

  const matches = matchOpportunities(founder, candidates);
  const scored = scoreOpportunities(matches, founderState);
  const top = scored[0];
  const opp = top.opportunity;

  // fix #4: genuine rank of the chosen opportunity among ALL opportunities. Skipped
  // in fast mode (counterfactual/peer re-runs don't need rank), which keeps the
  // "Dig deeper" panel responsive since it calls the pipeline a few hundred times.
  let globalRank = 1, globalUniverse = SECTOR_TABLE.length * STATE_TABLE.length, allScored = null;
  if (!fast) {
    allScored = scoreOpportunities(matchOpportunities(founder, getAllOpportunities()), founderState);
    const gi = allScored.findIndex((s) => s.opportunity.sector === opp.sector && s.opportunity.state === opp.state);
    globalRank = (gi >= 0 ? gi + 1 : 1);
    globalUniverse = allScored.length;
  }

  const resourcePlan = solveResourceOptimizer(founder.budgetInr, opp);
  const trend = weightedLeastSquaresTrend(opp.sector);
  const risk = riskScoreFor(getRiskModel(), opp);
  const markov = runMarkovChain(risk.riskScore, trend.slope);
  const mdp = solveMDP(risk.riskScore, trend.slope);
  const validation = runMarketExperiment(opp, resourcePlan.allocations["Marketing & Sales"], top.components.founder_fit);
  const final = decide(top.score, top.match.feasibilityProbability, risk.riskScore, mdp.policy.IDEA, validation.kpiAchievementRate, markov.probSuccess, capitalCoverageRatio(founder, opp), founder.skills.length === 0);

  return {
    founderWarnings: warnings,
    founderLocation: { rawInput: founder.location, resolvedState: founderState },
    topOpportunities: scored.slice(0, 10).map((s) => ({ sector: s.opportunity.sector, state: s.opportunity.state, score: s.score })),
    globalRank: globalRank, globalUniverse: globalUniverse,
    globalTop: allScored ? allScored.slice(0, 5).map((s) => ({ sector: s.opportunity.sector, state: s.opportunity.state, score: s.score })) : [],
    chosenOpportunity: {
      sector: opp.sector, state: opp.state, adjustedCapitalRequired: adjustedCapitalRequired(opp),
      demandIndex: opp.demand_index, growthRate: opp.growth_rate, competitionDensity: opp.competition_density,
      ecosystemIndex: opp.ecosystem_index, requiredSkills: opp.required_skills,
    },
    evidence: {
      opportunityScore: top.score, components: top.components,
      feasibilityProbability: top.match.feasibilityProbability, rawCosineSimilarity: top.match.similarity,
      skillOverlap: top.match.skillOverlap,
    },
    resourcePlan,
    trend,
    risk,
    businessEvolution: { markov, mdp },
    validation,
    finalDecision: final,
  };
}

  _internal: { buildOpportunities, buildFounderProfile, matchOpportunities, scoreOpportunities,

function polarToCartesian(cx, cy, r, angleDeg) {
  const a = (angleDeg * Math.PI) / 180;
  return { x: cx + r * Math.cos(a), y: cy - r * Math.sin(a) };

function describeArc(cx, cy, r, startDeg, endDeg) {
  const start = polarToCartesian(cx, cy, r, startDeg);
  const end = polarToCartesian(cx, cy, r, endDeg);
  const largeArc = endDeg - startDeg <= 180 ? 0 : 1;
  return `M ${start.x} ${start.y} A ${r} ${r} 0 ${largeArc} 0 ${end.x} ${end.y}`;
}

// The verdict as a compass bearing rather than a car-dashboard gauge: an
// engraved tick ring, three named headings (STOP / PIVOT / GO) sitting at
// their real decision thresholds, and a brass needle pointing at today's
// reading. The angle math is untouched from the original gauge -- only the
// instrument face around it is new.
function buildGauge(confidence, decision) {
  const cx = 130, cy = 148, r = 92;
  const conf = clamp01(confidence);
  const stopEnd = 180 - E.PIVOT_THRESHOLD * 180;
  const pivotEnd = 180 - E.GO_THRESHOLD * 180;

  // Needle is DRAWN at its final predicted position...
  const needleAngle = 180 - conf * 180;
  const needleTip = polarToCartesian(cx, cy, r - 20, needleAngle);
  const needleTail = polarToCartesian(cx, cy, 14, needleAngle + 180);

  // ...and then swept into place from the 0% (STOP) end. In SVG, rotate() is
  // clockwise-positive; sweeping from 0% up to the reading means starting the
  // group rotated COUNTER-clockwise by (conf*180) deg and animating back to 0.
  // We expose that start angle as a CSS var so the stylesheet drives the motion.
  const sweepStart = -(conf * 180);

  const zoneColor = { STOP: "#C96B6B", PIVOT: "#D1A860", GO: "#7FB89A" };
  const labelMid = (a, b) => (a + b) / 2;

  const ticks = [];
  for (let a = 0; a <= 180; a += 15) {
    const p1 = polarToCartesian(cx, cy, r + 3, a);
    const p2 = polarToCartesian(cx, cy, r + (a % 45 === 0 ? 11 : 7), a);
    ticks.push(`<line x1="${p1.x}" y1="${p1.y}" x2="${p2.x}" y2="${p2.y}" stroke="#4A5185" stroke-width="1.2"/>`);
  }

  function headingLabel(text, angle, color) {
    const p = polarToCartesian(cx, cy, r + 26, angle);
    return `<text x="${p.x}" y="${p.y}" text-anchor="middle" dominant-baseline="middle"
      font-family="IBM Plex Mono, monospace" font-size="10.5" letter-spacing="1" fill="${color}">${text}</text>`;
  }

  // Progress arc that fills from STOP(180deg) up to the needle's angle, so the
  // coloured "travelled" portion literally grows from 0 to the predicted value.
  const readArc = describeArc(cx, cy, r - 16, 180, needleAngle);
  const readColor = decision === "GO" ? zoneColor.GO : decision === "PIVOT" ? zoneColor.PIVOT : zoneColor.STOP;

  const svg = `
    <svg viewBox="0 0 260 172" width="240" height="159" class="vm-gauge" style="--sweep-start:${sweepStart}deg">
      ${ticks.join("")}
      <path d="${describeArc(cx, cy, r, 180, stopEnd)}" stroke="${zoneColor.STOP}" stroke-width="9" fill="none" stroke-linecap="round" opacity="0.35"/>
      <path d="${describeArc(cx, cy, r, stopEnd, pivotEnd)}" stroke="${zoneColor.PIVOT}" stroke-width="9" fill="none" opacity="0.35"/>
      <path d="${describeArc(cx, cy, r, pivotEnd, 0)}" stroke="${zoneColor.GO}" stroke-width="9" fill="none" stroke-linecap="round" opacity="0.35"/>
      <path class="vm-gauge-read" d="${readArc}" stroke="${readColor}" stroke-width="9" fill="none" stroke-linecap="round"/>
      ${headingLabel("STOP", labelMid(180, stopEnd), zoneColor.STOP)}
      ${headingLabel("PIVOT", labelMid(stopEnd, pivotEnd), zoneColor.PIVOT)}
      ${headingLabel("GO", labelMid(pivotEnd, 0), zoneColor.GO)}
      <circle cx="${cx}" cy="${cy}" r="${r - 16}" fill="none" stroke="#2A3166" stroke-width="1"/>
      <g class="vm-gauge-needle" style="transform-box:view-box;transform-origin:${cx}px ${cy}px">
        <line x1="${needleTail.x}" y1="${needleTail.y}" x2="${needleTip.x}" y2="${needleTip.y}" stroke="#F3F6FF" stroke-width="2.5" stroke-linecap="round"/>
      </g>
      <circle cx="${cx}" cy="${cy}" r="6.5" fill="#10142B" stroke="#F3F6FF" stroke-width="2"/>
      <circle cx="${cx}" cy="${cy}" r="2" fill="#F3F6FF"/>
    </svg>`;
  const wrap = el("div");
  wrap.innerHTML = svg;
  return wrap.firstElementChild;
}
function clamp01(x) { return Math.max(0, Math.min(1, x)); }

const FEEDBACK_EMAIL = "amaravanimeka@gmail.com";
const fbState = { rating: 0, tags: new Set(), note: "" };

function buildFeedback() {
  const RATINGS = [
    { v: 1, face: "\u{1F615}", word: "Rough" },

  // -- rating dial --

          c.classList.toggle("on", Number(c.getAttribute("data-v")) <= r.v);

  // -- quick-pick chips --
  card.appendChild(el("div", { class: "fb-sub", text: "What stood out?" }));

  TAGS.forEach((t) => {
    const c = el("button", {
      class: "fb-chip", text: t,
      onclick: () => {
        if (fbState.tags.has(t)) { fbState.tags.delete(t); c.classList.remove("on"); }

    });
    chipWrap.appendChild(c);
  });
  card.appendChild(chipWrap);

  // -- note --
  const note = el("textarea", {
    class: "fb-note", rows: "3",
    placeholder: "Anything else? (optional)",
  });
  note.addEventListener("input", () => { fbState.note = note.value; });
  card.appendChild(note);

  // -- send + status --
  const status = el("div", { class: "fb-status" });
  const send = el("button", {
    class: "btn btn-primary fb-send", text: "Send feedback",
    onclick: () => {
      if (fbState.rating === 0 && fbState.tags.size === 0 && !fbState.note.trim()) {
        status.textContent = "Tap a rating first \u2014 then send.";
        status.className = "fb-status warn";
        return;
      }
      const stars = fbState.rating ? "\u2605".repeat(fbState.rating) + "\u2606".repeat(5 - fbState.rating) : "(not rated)";
      const lines = [
        "VentureMind feedback",
        "----------------------",
        "Rating: " + (fbState.rating ? fbState.rating + "/5  " + stars : "not rated"),
        "Stood out: " + (fbState.tags.size ? Array.from(fbState.tags).join(", ") : "\u2014"),
        "Note: " + (fbState.note.trim() || "\u2014"),
      ];
      const subject = "VentureMind feedback" + (fbState.rating ? " \u2014 " + fbState.rating + "/5" : "");
      const href = "mailto:" + FEEDBACK_EMAIL +
        "?subject=" + encodeURIComponent(subject) +
        "&body=" + encodeURIComponent(lines.join("\n"));
      window.location.href = href;
      status.textContent = "Opening your mail app\u2026 thank you! \u{1F9E1}";
      status.className = "fb-status ok";
    },
  });
  card.appendChild(send);
  card.appendChild(status);

  return card;
}

// ============================================================================
//  DIG DEEPER — insight engine (all functions re-run the REAL pipeline E.runPipeline
//  with modified inputs; nothing is faked or estimated). Returns plain data; the
//  UI layer renders it. rawInputs is exactly what runAnalysis passed to runPipeline.
// ============================================================================
const GO_T = E.GO_THRESHOLD;

function _compAndDec(inp) {
  const r = E.runPipeline(inp, { fast: true });   // fast: skip global-rank rescore
  return { c: r.finalDecision.compositeConfidence, d: r.finalDecision.decision };
}

// ---- 1. COUNTERFACTUAL: highest-leverage single changes -------------------
// For each lever (budget / one skill / location) find the change that lifts the
// composite confidence the most, note whether it actually crosses into GO.
function cfBudget(base, c0) {
  // Is GO even reachable by budget alone? test a large budget.
  const hiInp = { ...base, budgetInr: Math.min(base.budgetInr * 60, 50000000) };
  const hi = _compAndDec(hiInp);
  if (hi.d === "GO" && hi.c >= GO_T) {
    // binary-search the minimum budget that reaches GO
    let lo = base.budgetInr, h = hiInp.budgetInr;
    for (let i = 0; i < 28; i++) {
      const m = (lo + h) / 2;
      const r = _compAndDec({ ...base, budgetInr: m });
      (r.d === "GO" && r.c >= GO_T) ? (h = m) : (lo = m);
    }
    return { type: "budget", reachesGo: true, to: h, newC: _compAndDec({ ...base, budgetInr: h }).c, atCap: false };
  }
  // budget is "at cap" when the founder is already at/near the ₹50M model ceiling,
  // so there's no meaningful "raise budget" move to suggest.
  const atCap = base.budgetInr >= 50000000 * 0.999;
  return { type: "budget", reachesGo: false, to: hiInp.budgetInr, newC: hi.c, atCap: atCap };
}

function cfSkill(base, c0) {
  let best = null;
  for (const s of E.SKILL_TAXONOMY) {
    if (base.skills.includes(s)) continue;
    const r = _compAndDec({ ...base, skills: base.skills.concat([s]) });
    const reaches = r.d === "GO" && r.c >= GO_T;
    if (!best || r.c > best.newC) best = { type: "skill", skill: s, reachesGo: reaches, newC: r.c };
  }
  return best;
}

function cfLocation(base, c0, resolvedState) {
  let best = null;
  for (const st of E.STATE_TABLE) {
    if (st.state === resolvedState) continue;
    const r = _compAndDec({ ...base, location: st.state });
    const reaches = r.d === "GO" && r.c >= GO_T;
    if (!best || r.c > best.newC) best = { type: "location", state: st.state, reachesGo: reaches, newC: r.c };
  }
  return best;
}

function computeCounterfactual(base, report) {
  const c0 = report.finalDecision.compositeConfidence;
  const resolvedState = report.founderLocation.resolvedState;
  const levers = [];
  levers.push(cfBudget(base, c0));
  const sk = cfSkill(base, c0); if (sk) levers.push(sk);
  const loc = cfLocation(base, c0, resolvedState); if (loc) levers.push(loc);
  levers.forEach((l) => {
    l.gain = l.newC - c0;
    // A lever is "actionable" if it represents a real, sensible change:
    //  - budget: not already at the model cap, and the target is clearly above current
    //  - skill/location: always a real change (adding a skill / relocating)
    if (l.type === "budget") {
      l.actionable = !l.atCap && l.to > base.budgetInr * 1.02;
    } else {
      l.actionable = true;
    }
  });
  levers.sort((a, b) => b.newC - a.newC);
  const anyReachesGo = levers.some((l) => l.reachesGo && l.actionable);
  return { c0, decision: report.finalDecision.decision, levers, anyReachesGo, goThreshold: GO_T };
}

// ---- 2. PEER PERCENTILE: rank vs random realistic founders ----------------
// Deterministic PRNG so the percentile is reproducible for the same profile.
function computePeerPercentile(base, report) {
  const c0 = report.finalDecision.compositeConfidence;
  const feas0 = report.evidence.feasibilityProbability;
  let seed = 0;
  // seed from the inputs so identical profiles give identical percentiles
  const sig = JSON.stringify([base.skills, base.budgetInr, base.location, base.interests, base.riskTolerance, base.timeAvailability]);
  for (let i = 0; i < sig.length; i++) seed = (seed * 31 + sig.charCodeAt(i)) & 0x7fffffff;
  seed = seed || 12345;
  const rnd = () => { seed = (seed * 1103515245 + 12345) & 0x7fffffff; return seed / 0x7fffffff; };
  const SK = E.SKILL_TAXONOMY, SEC = E.SECTOR_TAXONOMY, LOC = E.STATE_TABLE.map((s) => s.state);
  const N = 300;   // peer sample: statistically stable (~0.33 pct-pt resolution);
                   // the fast-mode pipeline keeps this responsive behind the loader
  let betterConf = 0, betterFeas = 0;
  for (let i = 0; i < N; i++) {
    const sk = SK.filter(() => rnd() > 0.82);
    let it = SEC.filter(() => rnd() > 0.80);
    if (!it.length) it = [SEC[Math.floor(rnd() * SEC.length)]];
    const peer = {
      skills: sk,
      budgetInr: Math.round(Math.pow(10, 5 + rnd() * 2.2)),
      location: LOC[Math.floor(rnd() * LOC.length)],
      interests: it,
      riskTolerance: ["low", "medium", "high"][Math.floor(rnd() * 3)],
      timeAvailability: ["part-time", "full-time"][Math.floor(rnd() * 2)],
    };
    const pr = E.runPipeline(peer, { fast: true });
    if (c0 > pr.finalDecision.compositeConfidence) betterConf++;
    if (feas0 > pr.evidence.feasibilityProbability) betterFeas++;
  }
  return {
    confPercentile: Math.round(100 * betterConf / N),
    feasPercentile: Math.round(100 * betterFeas / N),
    sampleSize: N,
  };
}

// ---- 3. OPPORTUNITY RANK among all considered -----------------------------
function computeOppRank(report) {
  const list = report.topOpportunities || [];
  const chosen = report.chosenOpportunity;
  const idx = list.findIndex((o) => o.sector === chosen.sector && o.state === chosen.state);
  // fix #4: use the genuine global rank among ALL opportunities, computed in the
  // engine by re-scoring the full 160-opportunity universe. Fall back gracefully.
  const universe = report.globalUniverse || (E.SECTOR_TABLE.length * E.STATE_TABLE.length);
  const globalRank = report.globalRank || (idx >= 0 ? idx + 1 : 1);
  const alts = (report.globalTop && report.globalTop.length ? report.globalTop : list);
  return {
    globalRank: globalRank,
    universe: universe,
    rankInShortlist: idx >= 0 ? idx + 1 : 1,
    shortlistSize: list.length,
    alternatives: alts.slice(1, 5),
  };
}

// ---- 4. SKILL MATCH / GAP -------------------------------------------------
function computeSkillGap(base, report) {
  const need = report.chosenOpportunity.requiredSkills || [];
  const have = base.skills || [];
  const matched = need.filter((s) => have.includes(s));
  const missing = need.filter((s) => !have.includes(s));
  const extra = have.filter((s) => !need.includes(s));
  return {
    need: need.map((s) => ({ key: s, label: E.SKILL_LABELS[s] || s, has: have.includes(s) })),
    matched: matched.map((s) => E.SKILL_LABELS[s] || s),
    missing: missing.map((s) => E.SKILL_LABELS[s] || s),
    extra: extra.map((s) => E.SKILL_LABELS[s] || s),
    coverage: need.length ? matched.length / need.length : null,
  };
}

// ---- 5. SCORE-MATH WATERFALL (exact decomposition of composite) -----------
function computeScoreMath(report) {
  const W = E.DECISION_WEIGHTS;
  const ev = report.evidence, rk = report.risk, val = report.validation, mk = report.businessEvolution.markov;
  const parts = [
    { key: "opportunity_score", label: "Opportunity strength", value: ev.opportunityScore, weight: W.opportunity_score },
    { key: "feasibility_probability", label: "Feasibility (can you pull it off)", value: ev.feasibilityProbability, weight: W.feasibility_probability },
    { key: "risk_inverse", label: "Low market-risk index", value: 1 - rk.riskScore, weight: W.risk_inverse },
    { key: "kpi_achievement_rate", label: "Simulated KPI success", value: val.kpiAchievementRate, weight: W.kpi_achievement_rate },
    { key: "markov_success_probability", label: "Model success likelihood", value: mk.probSuccess, weight: W.markov_success_probability },
  ];
  parts.forEach((p) => { p.contribution = p.value * p.weight; });
  const total = parts.reduce((a, p) => a + p.contribution, 0);
  const sorted = parts.slice().sort((a, b) => a.contribution - b.contribution);
  return { parts, total, weakest: sorted[0], strongest: sorted[sorted.length - 1] };
}

// ---- master: compute everything once --------------------------------------
function computeInsights(base, report) {
  return {
    counterfactual: computeCounterfactual(base, report),
    peer: computePeerPercentile(base, report),
    rank: computeOppRank(report),
    skillGap: computeSkillGap(base, report),
    scoreMath: computeScoreMath(report),
  };
}


// ============================================================================
//  DIG DEEPER drawer — a slide-in panel of 6 reasoning tools. Built lazily the
//  first time it's opened (insights are computed once and cached on the report).
// ============================================================================
let digDrawerEl = null, digBackdropEl = null, digBuiltFor = null;

function pctTxt(x) { return Math.round(x * 100) + "%"; }
function pct1(x) { return (x * 100).toFixed(1) + "%"; }

function digOrdinal(n) {
  const s = ["th", "st", "nd", "rd"], v = n % 100;
  return n + (s[(v - 20) % 10] || s[v] || s[0]);
}

// ---------- individual insight section builders ----------
function digSection(num, title, subtitle, bodyNodes, openByDefault) {
  const head = el("button", { class: "dig-sec-head", "aria-expanded": openByDefault ? "true" : "false" }, [
    el("span", { class: "dig-sec-num", text: String(num) }),
    el("span", { class: "dig-sec-titles" }, [
      el("span", { class: "dig-sec-title", text: title }),
      el("span", { class: "dig-sec-sub", text: subtitle }),
    ]),
    el("span", { class: "dig-sec-chev", text: "›" }),
  ]);
  const body = el("div", { class: "dig-sec-body" }, bodyNodes);
  if (!openByDefault) body.style.display = "none";
  head.addEventListener("click", () => {
    const open = head.getAttribute("aria-expanded") === "true";
    head.setAttribute("aria-expanded", open ? "false" : "true");
    body.style.display = open ? "none" : "block";
  });
  return el("div", { class: "dig-sec" }, [head, body]);
}

function leverLabel(l) {
  if (l.type === "budget") return "Raise budget to " + fmtINR(Math.round(l.to));
  if (l.type === "skill") return "Add skill: " + (E.SKILL_LABELS[l.skill] || l.skill);
  if (l.type === "location") return "Base yourself in " + l.state;
  return "";
}

function buildCounterfactualSection(cf) {
  const nodes = [];
  const isGo = cf.decision === "GO";
  // For a GO case, only levers that genuinely IMPROVE confidence are worth showing
  // as "suggestions"; a lever with <= 0 gain would be bad advice. For PIVOT/STOP we
  // show every lever (the gains, positive or not, are the honest leverage picture).
  const MIN_GAIN = 0.003; // 0.3 pts — ignore noise-level moves
  // Only ever suggest levers that are actionable (a real, sensible change). For a
  // GO case we further require a positive gain, so we never suggest a change that
  // wouldn't actually help.
  let shown = cf.levers.filter((l) => l.actionable);
  if (isGo) shown = shown.filter((l) => l.gain > MIN_GAIN);
  // honest note if budget can't be a lever because it's already at the ceiling
  const budgetAtCap = cf.levers.some((l) => l.type === "budget" && l.atCap);

  if (isGo) {
    if (shown.length) {
      nodes.push(el("p", { class: "dig-note", text: "You're already at GO. These single changes would push your confidence even higher:" }));
    } else {
      nodes.push(el("p", { class: "dig-note", text: "You're already at GO, and your profile is close to the best this opportunity can score — no single change meaningfully raises it further. This is a strong, well-matched position." }));
    }
  } else if (cf.anyReachesGo) {
    nodes.push(el("p", { class: "dig-note", text: "Each option below is a single change that, on re-running the full model, flips this into a GO:" }));
  } else if (shown.length) {
    nodes.push(el("p", { class: "dig-note", text: "No single change reaches GO (" + pctTxt(cf.goThreshold) + ") on its own — here is the highest-leverage move in each lever, with the honest gain each gives:" }));
  } else {
    nodes.push(el("p", { class: "dig-note", text: "No single input change moves this toward GO — the verdict is driven by market and lifecycle factors here, not by your profile." }));
  }

  shown.forEach((l) => {
    const row = el("div", { class: "dig-lever" });
    const top = el("div", { class: "dig-lever-top" }, [
      el("span", { class: "dig-lever-label", text: leverLabel(l) }),
      el("span", { class: "dig-lever-badge " + (l.reachesGo ? "go" : "partial"), text: l.reachesGo && !isGo ? "→ GO" : pct1(l.newC) }),
    ]);
    const trackFill = el("div", { class: "dig-lever-fill", style: "width:" + Math.max(2, Math.min(100, l.newC * 100)) + "%" });
    const goMark = el("div", { class: "dig-lever-goline", style: "left:" + (cf.goThreshold * 100) + "%" });
    const track = el("div", { class: "dig-lever-track" }, [trackFill, goMark]);
    const gain = el("div", { class: "dig-lever-gain", text: (l.gain >= 0 ? "+" : "") + (l.gain * 100).toFixed(1) + " pts → " + pct1(l.newC) + (l.reachesGo && !isGo ? "  (crosses GO)" : "") });
    row.appendChild(top); row.appendChild(track); row.appendChild(gain);
    nodes.push(row);
  });

  if (budgetAtCap) {
    nodes.push(el("p", { class: "dig-foot dim", text: "Budget isn't shown as a lever — you're already at the top of the model's budget range, so adding more money changes nothing here." }));
  }
  if (!cf.anyReachesGo && !isGo && shown.length) {
    nodes.push(el("p", { class: "dig-foot", text: "The ceiling here is held down by the long-run success odds, which founder inputs barely move — an honest signal that this specific path is structurally hard, not just under-resourced." }));
  }
  return nodes;
}

function buildPeerSection(peer, report) {
  const nodes = [];
  const c = report.finalDecision.compositeConfidence;
  // percentile gauge (confidence)
  const mk = (label, p) => {
    const wrap = el("div", { class: "dig-peer-row" });
    wrap.appendChild(el("div", { class: "dig-peer-label", text: label }));
    const track = el("div", { class: "dig-peer-track" }, [
      el("div", { class: "dig-peer-fill", style: "width:" + Math.max(2, p) + "%" }),
      el("div", { class: "dig-peer-you", style: "left:" + Math.max(0, Math.min(100, p)) + "%" }),
    ]);
    wrap.appendChild(track);
    wrap.appendChild(el("div", { class: "dig-peer-val", text: "Beats " + p + "% of founders" }));
    return wrap;
  };
  nodes.push(el("p", { class: "dig-note", text: "Your profile, scored against " + peer.sampleSize + " randomly-generated realistic founders run through the same model:" }));
  nodes.push(mk("Overall confidence", peer.confPercentile));
  nodes.push(mk("Feasibility (can you execute)", peer.feasPercentile));
  let verdict;
  if (peer.confPercentile >= 75) verdict = "You're in the top quartile — a genuinely strong setup for this opportunity.";
  else if (peer.confPercentile >= 50) verdict = "You're above the median founder for this kind of venture.";
  else if (peer.confPercentile >= 25) verdict = "You're below the median — the counterfactual tab shows your highest-leverage fixes.";
  else verdict = "You're in the bottom quartile here — worth strengthening your profile before committing.";
  nodes.push(el("p", { class: "dig-foot", text: verdict }));
  return nodes;
}

function buildRankSection(rank, report) {
  const nodes = [];
  const co = report.chosenOpportunity;
  nodes.push(el("p", { class: "dig-note", html: "Your pick — <b>" + esc(co.sector) + " in " + esc(co.state) + "</b> — ranks <b>#" + rank.globalRank + " of all " + rank.universe + "</b> sector×state opportunities the model can consider, scored for your profile." }));
  if (rank.alternatives.length) {
    nodes.push(el("div", { class: "dig-sub-h", text: "Next best alternatives" }));
    rank.alternatives.forEach((a, i) => {
      const row = el("div", { class: "dig-alt" }, [
        el("span", { class: "dig-alt-rank", text: String(i + 2) }),
        el("span", { class: "dig-alt-name", text: a.sector + " · " + a.state }),
        el("span", { class: "dig-alt-score", text: pctTxt(a.score) }),
      ]);
      nodes.push(row);
    });
  }
  return nodes;
}

function buildSkillGapSection(gap) {
  const nodes = [];
  if (gap.coverage === null) {
    nodes.push(el("p", { class: "dig-note", text: "This opportunity lists no specific required skills to compare against." }));
    return nodes;
  }
  nodes.push(el("p", { class: "dig-note", text: "You cover " + Math.round(gap.coverage * 100) + "% of what this opportunity needs:" }));
  const grid = el("div", { class: "dig-skill-grid" });
  gap.need.forEach((s) => {
    grid.appendChild(el("span", { class: "dig-skill-chip " + (s.has ? "has" : "miss"), text: (s.has ? "✓ " : "✕ ") + s.label }));
  });
  nodes.push(grid);
  if (gap.missing.length) {
    nodes.push(el("p", { class: "dig-foot", html: "<b>Capability gap:</b> " + gap.missing.join(", ") + ". These are the skills to learn, hire, or find a co-founder for." }));
  } else {
    nodes.push(el("p", { class: "dig-foot", text: "You fully cover this opportunity's stated skill requirements — a strong fit." }));
  }
  if (gap.extra.length) {
    nodes.push(el("p", { class: "dig-foot dim", text: "Extra skills you bring beyond what's required: " + gap.extra.join(", ") + "." }));
  }
  return nodes;
}

function buildScoreMathSection(sm, report) {
  const nodes = [];
  nodes.push(el("p", { class: "dig-note", html: "The final confidence of <b>" + Math.round(report.finalDecision.compositeConfidence * 100) + "%</b> is the exact sum of five weighted parts — nothing hidden:" }));
  const maxContrib = Math.max.apply(null, sm.parts.map((p) => p.contribution));
  sm.parts.forEach((p) => {
    const row = el("div", { class: "dig-math-row" });
    row.appendChild(el("div", { class: "dig-math-head" }, [
      el("span", { class: "dig-math-label", text: p.label }),
      el("span", { class: "dig-math-contrib", text: "+" + (p.contribution * 100).toFixed(1) }),
    ]));
    row.appendChild(el("div", { class: "dig-math-track" }, [
      el("div", { class: "dig-math-fill", style: "width:" + (maxContrib > 0 ? (p.contribution / maxContrib * 100) : 0) + "%" }),
    ]));
    row.appendChild(el("div", { class: "dig-math-detail", text: pctTxt(p.value) + " score × " + Math.round(p.weight * 100) + "% weight" }));
    nodes.push(row);
  });
  nodes.push(el("div", { class: "dig-math-total" }, [
    el("span", { text: "Total confidence" }),
    el("span", { text: Math.round(sm.total * 100) + "%" }),
  ]));
  nodes.push(el("p", { class: "dig-foot", html: "Biggest contributor: <b>" + sm.strongest.label + "</b>. Dragging you down most: <b>" + sm.weakest.label + "</b>." }));
  return nodes;
}

// ---------- drawer shell ----------
function buildDigShell() {
  const backdrop = el("div", { class: "dig-backdrop", onclick: closeDigDrawer });
  const panel = el("div", { class: "dig-panel", role: "dialog", "aria-label": "Deeper analysis" });
  const header = el("div", { class: "dig-head" }, [
    el("div", {}, [
      el("div", { class: "dig-eyebrow", text: "DEEPER ANALYSIS" }),
      el("div", { class: "dig-title", text: "Why this verdict — and what moves it" }),
    ]),
    el("button", { class: "dig-close", "aria-label": "Close", text: "✕", onclick: closeDigDrawer }),
  ]);
  panel.appendChild(header);
  const scroll = el("div", { class: "dig-scroll" });
  // loading state shown instantly while insights compute off the paint frame
  const loader = el("div", { class: "dig-loading" }, [
    el("div", { class: "dig-spinner" }),
    el("div", { class: "dig-loading-txt", text: "Re-running the model across budget, skill and location changes…" }),
  ]);
  scroll.appendChild(loader);
  panel.appendChild(scroll);
  document.body.appendChild(backdrop);
  document.body.appendChild(panel);
  digBackdropEl = backdrop; digDrawerEl = panel;
  void panel.offsetWidth;
  backdrop.classList.add("show");
  panel.classList.add("show");
  return scroll;
}

function populateDigDrawer(scroll, base, report, insights) {
  scroll.innerHTML = "";
  const cfIsGo = insights.counterfactual.decision === "GO";
  const cfTitle = cfIsGo ? "How to make this even stronger" : "What would make this a GO?";
  const cfSub = cfIsGo ? "Your highest-leverage improvements" : "Your highest-leverage changes";
  scroll.appendChild(digSection(1, cfTitle, cfSub, buildCounterfactualSection(insights.counterfactual), true));
  scroll.appendChild(digSection(2, "Where you stand", "Ranked against other founders", buildPeerSection(insights.peer, report), false));
  scroll.appendChild(digSection(3, "Your skills vs. what it needs", "Capability match & gaps", buildSkillGapSection(insights.skillGap), false));
  scroll.appendChild(digSection(4, "How the score is built", "Exact weighted breakdown", buildScoreMathSection(insights.scoreMath, report), false));
  scroll.appendChild(digSection(5, "Opportunity ranking", "Your pick vs. the alternatives", buildRankSection(insights.rank, report), false));
}

let digInsightsCache = null;
function openDigDrawer() {
  if (!lastReport || !lastBaseInputs) return;
  if (digDrawerEl) { digBackdropEl.classList.add("show"); digDrawerEl.classList.add("show"); return; }
  const scroll = buildDigShell();            // opens instantly with a spinner
  document.body.style.overflow = "hidden";
  const base = lastBaseInputs, report = lastReport;
  // defer the heavy compute so the browser paints the open drawer first
  setTimeout(function () {
    if (!digDrawerEl) return;                // user closed it before compute finished
    try {
      const insights = digInsightsCache || computeInsights(base, report);
      digInsightsCache = insights;
      populateDigDrawer(scroll, base, report, insights);
    } catch (e) {
      scroll.innerHTML = "";
      scroll.appendChild(el("div", { class: "dig-note", text: "Could not compute deeper analysis: " + e.message }));
    }
  }, 40);
}

function closeDigDrawer() {
  if (digBackdropEl) digBackdropEl.classList.remove("show");
  if (digDrawerEl) digDrawerEl.classList.remove("show");
  document.body.style.overflow = "";
  // remove after transition
  setTimeout(() => {
    if (digBackdropEl && digBackdropEl.parentNode) digBackdropEl.parentNode.removeChild(digBackdropEl);
    if (digDrawerEl && digDrawerEl.parentNode) digDrawerEl.parentNode.removeChild(digDrawerEl);
    digBackdropEl = null; digDrawerEl = null;
  }, 360);
}


function buildResults() {
  const r = lastReport;
  const wrap = el("div", { class: "results" });

  if (r.founderWarnings && r.founderWarnings.length) {
    wrap.appendChild(el("div", { class: "warning-box",
      html: "<b>Heads up:</b><br>" + r.founderWarnings.map(w => "\u2022 " + esc(w)).join("<br>") }));
  }

  // -- gauge card --
  const gaugeCard = el("div", { class: "gauge-card", id: "section-verdict" });
  gaugeCard.appendChild(buildGauge(r.finalDecision.compositeConfidence, r.finalDecision.decision));
  gaugeCard.appendChild(el("div", { class: "gauge-decision " + r.finalDecision.decision, text: r.finalDecision.decision }));
  gaugeCard.appendChild(el("div", { class: "gauge-conf",
    text: "Overall confidence " + Math.round(r.finalDecision.compositeConfidence * 100) + "%" }));
  wrap.appendChild(gaugeCard);

  // -- rationale --
  // When the founder gave no recognized skills, founder-fit couldn't really be
  // judged -- so instead of quietly folding skills into the reasoning, we add
  // an explicit caveat item that says this AND lists the skills this specific
  // opportunity actually needs, so the user sees exactly what's missing.
  const rationaleItems = [];
  const noSkills = (r.evidence && r.evidence.skillOverlap === 0) &&
    (r.founderWarnings || []).some((w) => w.toLowerCase().includes("no recognized skills"));
  if (noSkills) {
    const need = (r.chosenOpportunity.requiredSkills || [])
      .map((s) => (E.SKILL_LABELS && E.SKILL_LABELS[s]) ? E.SKILL_LABELS[s] : s);
    const needTxt = need.length ? need.join(", ") : "relevant hands-on skills";
    rationaleItems.push(el("li", { class: "why-caveat",
      html: "<b>Caution \u2014 you didn't tell us any of your skills.</b> "
        + "So this recommendation could not judge whether you're equipped to run it \u2014 it's ranked "
        + "purely on market factors (demand, competition, location, affordability, risk), not on you. "
        + "This opportunity really needs: <b>" + needTxt + "</b>. "
        + "If you don't have (or can't hire) these, treat the verdict with caution and re-run with your real skills." }));
  }
  // When no skills were given, the engine's fit/skill-based reasoning lines would
  // contradict the caution above (they'd claim a fit we never measured). Rewrite
  // those specific lines to be honest and skill-neutral, and drop the redundant
  // "ability to pull this off" line entirely. Market/risk/simulation/lifecycle
  // lines are unaffected. (Engine output itself is untouched -- this is display-only.)
  r.finalDecision.rationale.forEach((line) => {
    let text = line;
    if (noSkills) {
      if (/estimated ability to actually pull this off/i.test(line)) return; // drop: meaningless without skills
      text = text
        .replace("how well it fits your skills and location", "location fit")
        .replace("feels achievable for you, ", "")
        .replace(/,?\s*feels achievable for you/i, "");
    }
    rationaleItems.push(el("li", { text: text }));
  });
  const rationaleCard = el("div", { class: "card" }, [
    el("h3", { text: "Why" }),
    el("ul", { class: "rationale-list" }, rationaleItems),
  ]);
  wrap.appendChild(rationaleCard);

  // -- opportunity --
  const co = r.chosenOpportunity;
  const oppCard = el("div", { class: "card", id: "section-opportunity" }, [
    el("div", { class: "subtle", text: "RECOMMENDED OPPORTUNITY" }),
    el("div", { class: "opp-headline", text: co.sector }),
    el("div", { class: "opp-sub", text: co.state + " \u00b7 your location: " +
      (r.founderLocation.resolvedState || (r.founderLocation.rawInput || "unspecified") + " (unresolved)") }),
    el("div", { class: "tag-row" }, co.requiredSkills.map((s) => el("span", { class: "tag", text: E.SKILL_LABELS[s] || s }))),
  ]);
  wrap.appendChild(oppCard);

  // -- score breakdown --
  const weights = E.DEFAULT_WEIGHTS;
  const compLabels = { demand: "Market demand", competition: "Low competition", founder_fit: "Fit with you",
    capital_feasibility: "Affordability", risk: "Low risk", location: "Location match" };
  const scoreCard = el("div", { class: "card", id: "section-score" }, [
    el("h3", { text: "Score breakdown" }),
    el("div", { class: "subtle", text: "Opportunity score: " + Math.round(r.evidence.opportunityScore * 100) + " / 100" }),
  ]);
  Object.keys(compLabels).forEach((k) => {
    const v = r.evidence.components[k];
    scoreCard.appendChild(el("div", { class: "bar-row" }, [
      el("div", { class: "bar-label" }, [
        el("span", { class: "name", text: compLabels[k] + " (" + Math.round(weights[k] * 100) + "% weight)" }),
        el("span", { class: "val", text: Math.round(v * 100) + "%" }),
      ]),
      el("div", { class: "bar-track" }, [el("div", { class: "bar-fill", style: "width:" + (v * 100) + "%" })]),
    ]));
  });
  wrap.appendChild(scoreCard);

  // -- resource plan --
  const palette = ["#A9812E", "#2F6B4F", "#AD7A2A", "#10142B", "#8B93C7"];
  const allocCard = el("div", { class: "card", id: "section-budget" }, [
    el("h3", { text: "Suggested budget split" }),
    el("div", { class: "subtle", text: fmtINR(r.resourcePlan.budget) + " total" +
      (r.resourcePlan.minimumsScaled ? " \u2014 minimums scaled down to fit your budget" : "") }),
  ]);
  E.CATEGORIES.forEach((cat, i) => {
    allocCard.appendChild(el("div", { class: "alloc-row" }, [
      el("div", { class: "alloc-dot", style: "background:" + palette[i] }),
      el("div", { class: "alloc-name", text: cat }),
      el("div", { class: "alloc-amt", text: fmtINR(r.resourcePlan.allocations[cat]) + " (" +
        Math.round(r.resourcePlan.fractions[cat] * 100) + "%)" }),
    ]));
  });
  wrap.appendChild(allocCard);

  // -- trend & risk --
  const trendCard = el("div", { class: "card", id: "section-trend" }, [
    el("h3", { text: "Market trend & risk" }),
    el("div", { class: "metric-grid" }, [
      el("div", { class: "metric" }, [
        el("div", { class: "m-label", text: "6-month demand trend" }),
        el("div", { class: "m-val", text: (r.trend.slope >= 0 ? "\u2191 " : "\u2193 ") + Math.abs(r.trend.slope * 100).toFixed(2) + "%/mo" }),
        el("div", { class: "m-target", text: "fit quality R\u00b2 = " + r.trend.rSquared.toFixed(2) }),
      ]),
      el("div", { class: "metric" }, [
        el("div", { class: "m-label", text: "Market-risk index" }),
        el("div", { class: "m-val", text: Math.round(r.risk.riskScore * 100) + "%" }),
        el("div", { class: "m-target", text: "relative score, not a probability" }),
      ]),
    ]),
  ]);
  wrap.appendChild(trendCard);

  // -- business evolution --
  const be = r.businessEvolution;
  const successPct = Math.round(be.markov.probSuccess * 100);
  const evoCard = el("div", { class: "card", id: "section-evolution" }, [
    el("h3", { text: "How this tends to play out" }),
    el("div", { class: "bar-row" }, [
      el("div", { class: "bar-label" }, [
        el("span", { class: "name", text: "Model-estimated success likelihood (lifecycle model)" }),
        el("span", { class: "val", text: successPct + "%" }),
      ]),
      el("div", { class: "bar-track" }, [el("div", { class: "bar-fill", style: "width:" + successPct + "%;background:" +
        (be.markov.probSuccess < E.MARKOV_SUCCESS_GO_FLOOR ? "var(--oxblood)" : "var(--pine)") })]),
    ]),
    el("div", { class: "subtle", style: "margin-top:10px", text: "Recommended move at each stage:" }),
  ]);
  E.STATES.slice(0, 5).forEach((s) => {
    evoCard.appendChild(el("div", { class: "stage-row" }, [
      el("span", { text: s.replace("_", " ") }),
      el("span", { class: "stage-badge " + be.mdp.policy[s], text: be.mdp.policy[s].replace("_", " ") }),
    ]));
  });
  wrap.appendChild(evoCard);

  // -- validation --
  const val = r.validation;
  const valCard = el("div", { class: "card", id: "section-validation" }, [
    el("h3", { text: "Simulated market test" }),
    el("div", { class: "subtle", text: val.simulations.toLocaleString() + " simulated attempts \u00b7 " +
      Math.round(val.kpiAchievementRate * 100) + "% hit their targets" }),
    el("div", { class: "metric-grid" }, [
      el("div", { class: "metric" }, [
        el("div", { class: "m-label", text: "Monthly customers" }),
        el("div", { class: "m-val", text: Math.round(val.meanMonthlyCustomers) }),
        el("div", { class: "m-target", text: "target \u2265 " + Math.round(val.targets.minMonthlyCustomers) }),
      ]),
      el("div", { class: "metric" }, [
        el("div", { class: "m-label", text: "Conversion rate" }),
        el("div", { class: "m-val", text: (val.meanConversionRate * 100).toFixed(1) + "%" }),
        el("div", { class: "m-target", text: "target \u2265 " + (val.targets.minConversionRate * 100).toFixed(1) + "%" }),
      ]),
      el("div", { class: "metric" }, [
        el("div", { class: "m-label", text: "Cost per customer" }),
        el("div", { class: "m-val", text: fmtINR(val.meanCacInr) }),
        el("div", { class: "m-target", text: "target \u2264 " + fmtINR(val.targets.maxCacInr) }),
      ]),
    ]),
  ]);
  wrap.appendChild(valCard);

  wrap.appendChild(buildFeedback());
  wrap.appendChild(el("div", { class: "disclaimer" }, [
    el("div", { text: "How to read this: the market inputs are benchmarked against real 2024 data — sector demand, competition and growth are derived from Inc42's \"State of Indian Startup Funding 2024\" (funding + deal counts), every sector growth rate is a real published India market CAGR, and state ecosystem strength comes from DPIIT recognised-startup counts and the official DPIIT States' Startup Ranking 2022. The feasibility, risk, lifecycle and simulation models are transparent mathematical models run on this device — model estimates, not measured probabilities of real-world success. Capital requirements and failure rates are reasoned estimates. Treat this as a structured, data-informed way to compare options, not a guarantee." }),
    el("div", { class: "disclaimer-src", html: "Sources: Inc42 2024 Startup Funding Report (sector funding/deals) · DPIIT / Startup India (state startup counts) · DPIIT States' Startup Ranking 2022 (state tiers) · MarketsandMarkets, IMARC, Lumikai (sector market CAGRs)." }),
  ]));

  wrap.appendChild(el("button", { class: "btn btn-primary restart-btn", text: "Chart a new course",
    onclick: () => { resetState(); render(); } }));

  wrap.appendChild(buildCredits());

  return wrap;
}

function resetState() {
  state.step = 0; state.skills = new Set(); state.skillsFreeText = ""; state.budget = null;
  state.location = ""; state.interests = new Set(); state.interestsFreeText = ""; state.risk = null; state.time = null;
  lastReport = null;
}

render();
})();


</script>
<script>
/* ==========================================================================
   PRESENTATION LAYER ONLY
   Watches the DOM the original render() produces and adds purely visual
   classes (entrance motion, selection pop, scroll-spy highlight) plus the
   custom pointer. It never reads or writes app state, never calls render(),
   never touches the engine, and never changes any text or value.
   ========================================================================== */
(function () {
  "use strict";
  var app = document.getElementById("app");
  if (!app) return;
  var reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  // ---------- screen-change detection -> entrance classes ----------
  var lastKey = null, lastIndex = -1, heroDone = false, lastPicked = null;

  function screenKey() {
    if (app.querySelector(".results")) return { key: "results", index: 99 };
    var lbl = app.querySelector(".step-label");
    if (!lbl) return { key: "none", index: -1 };
    var m = /(\d+)/.exec(lbl.textContent || "");
    return { key: lbl.textContent, index: m ? parseInt(m[1], 10) : 0 };
  }

  function decorate() {
    var s = screenKey();
    var hero = app.querySelector(".hero");
    if (hero && !heroDone) { hero.classList.add("vm-in"); heroDone = true; }

    if (s.key !== lastKey) {
      var body = app.querySelector(".step") || app.querySelector(".results");
      if (body) {
        body.classList.add("vm-enter");
        if (s.index < lastIndex && s.key !== "results") body.classList.add("vm-back");
      }
      if (s.index > lastIndex && s.key !== "results") {
        var dots = app.querySelectorAll(".progress .dot.done");
        if (dots.length) dots[dots.length - 1].classList.add("vm-grow");
      }
      if (s.key === "results") setupSpy();
      lastKey = s.key; lastIndex = s.index;
    } else if (lastPicked) {
      // same screen re-rendered after a pick: pop the element that just got selected
      var nodes = app.querySelectorAll(lastPicked.sel);
      for (var i = 0; i < nodes.length; i++) {
        if (nodes[i].textContent === lastPicked.text && nodes[i].classList.contains("selected")) {
          nodes[i].classList.add("vm-pop");
          break;
        }
      }
    }
    lastPicked = null;
  }

  document.addEventListener("click", function (e) {
    var t = e.target && e.target.closest ? e.target.closest(".chip, .choice-card") : null;
    if (t) lastPicked = { sel: t.classList.contains("chip") ? ".chip" : ".choice-card", text: t.textContent };
  }, true);

  new MutationObserver(function () { decorate(); }).observe(app, { childList: true });
  decorate();

  // ---------- results sidebar scroll-spy ----------
  var spyHandler = null;
  function setupSpy() {
    if (spyHandler) window.removeEventListener("scroll", spyHandler);
    var links = app.querySelectorAll(".results-nav .nav-item");
    if (!links.length) return;
    spyHandler = function () {
      var line = window.innerHeight * 0.4, current = null;
      for (var i = 0; i < links.length; i++) {
        var sec = document.getElementById(links[i].getAttribute("href").slice(1));
        if (sec && sec.getBoundingClientRect().top <= line) current = links[i];
      }
      if (!current) current = links[0];
      if ((window.innerHeight + window.scrollY) >= document.documentElement.scrollHeight - 4) current = links[links.length - 1];
      for (var j = 0; j < links.length; j++) links[j].classList.toggle("vm-active", links[j] === current);
    };
    window.addEventListener("scroll", spyHandler, { passive: true });
    spyHandler();
  }

  // ---------- pointer spotlight on cards ----------
  document.addEventListener("pointermove", function (e) {
    var c = e.target && e.target.closest ? e.target.closest(".card, .choice-card") : null;
    if (!c) return;
    var r = c.getBoundingClientRect();
    c.style.setProperty("--mx", (e.clientX - r.left) + "px");
    c.style.setProperty("--my", (e.clientY - r.top) + "px");
  }, { passive: true });

  // ---------- custom pointer ----------
  var fine = window.matchMedia && window.matchMedia("(hover: hover) and (pointer: fine)").matches;
  var cursor = document.createElement("div");
  cursor.className = "vm-cursor is-hidden";
  cursor.innerHTML = '<div class="vm-cursor-ring"></div><div class="vm-cursor-dot"></div>';
  document.body.appendChild(cursor);
  var ring = cursor.firstChild, dot = cursor.lastChild;
  var mx = -100, my = -100, rx = -100, ry = -100, running = false;

  function loop() {
    var k = reduceMotion ? 1 : 0.2;
    rx += (mx - rx) * k; ry += (my - ry) * k;
    ring.style.transform = "translate3d(" + rx + "px," + ry + "px,0)";
    if (Math.abs(mx - rx) > 0.1 || Math.abs(my - ry) > 0.1) requestAnimationFrame(loop);
    else running = false;
  }
  function kick() { if (!running) { running = true; requestAnimationFrame(loop); } }

  function refreshHover(target) {
    var interactive = target && target.closest ? target.closest("button, a, .chip, .choice-card, [role=button]") : null;
    var text = target && target.closest ? target.closest("input, textarea") : null;
    cursor.classList.toggle("is-hover", !!interactive && !interactive.disabled);
    cursor.classList.toggle("is-disabled", !!interactive && !!interactive.disabled);
    cursor.classList.toggle("is-text", !!text);
  }

  if (fine) {
    document.addEventListener("mousemove", function (e) {
      document.documentElement.classList.add("vm-pointer");
      cursor.classList.remove("is-hidden");
      mx = e.clientX; my = e.clientY;
      dot.style.transform = "translate3d(" + mx + "px," + my + "px,0)";
      refreshHover(e.target);
      kick();
    }, { passive: true });
    document.addEventListener("mouseleave", function () { cursor.classList.add("is-hidden"); });
    document.documentElement.addEventListener("mouseleave", function () { cursor.classList.add("is-hidden"); });
    document.addEventListener("mousedown", function () { cursor.classList.add("is-down"); });
    document.addEventListener("mouseup", function () {
      cursor.classList.remove("is-down");
      // the element under the pointer may have been re-rendered; re-check what's there now
      setTimeout(function () { refreshHover(document.elementFromPoint(mx, my)); }, 0);
    });
  }

  // ---------- click burst (selection feedback, mouse and touch) ----------
  var COLORS = ["#FFB23F", "#FF4F8B", "#19C6B7", "#FFF3E4"];
  document.addEventListener("pointerdown", function (e) {
    if (reduceMotion) return;
    var t = e.target && e.target.closest ? e.target.closest(".chip, .choice-card, .btn:not(:disabled)") : null;
    if (!t) return;
    var x = e.clientX, y = e.clientY;
    var rip = document.createElement("div");
    rip.className = "vm-ripple";
    rip.style.left = x + "px"; rip.style.top = y + "px";
    document.body.appendChild(rip);
    setTimeout(function () { rip.remove(); }, 650);
    var willSelect = !t.classList.contains("selected");
    if (!willSelect || t.classList.contains("btn")) return;
    for (var i = 0; i < 9; i++) {
      var s = document.createElement("div");
      s.className = "vm-spark";
      var a = (Math.PI * 2 * i) / 9 + Math.random() * 0.5;
      var d = 26 + Math.random() * 22;
      s.style.left = x + "px"; s.style.top = y + "px";
      s.style.background = COLORS[i % COLORS.length];
      s.style.boxShadow = "0 0 8px " + COLORS[i % COLORS.length];
      s.style.setProperty("--dx", Math.cos(a) * d + "px");
      s.style.setProperty("--dy", Math.sin(a) * d + "px");
      document.body.appendChild(s);
      (function (n) { setTimeout(function () { n.remove(); }, 650); })(s);
    }
  }, { passive: true });
})();
</script>
<script>
/* Full-screen support (presentation only; does not touch app state). */
(function () {
  "use strict";
  var d = document, root = d.documentElement;
  var req = root.requestFullscreen || root.webkitRequestFullscreen;
  var exit = d.exitFullscreen || d.webkitExitFullscreen;
  function isFs() { return !!(d.fullscreenElement || d.webkitFullscreenElement); }
  var standalone = (window.matchMedia && window.matchMedia("(display-mode: standalone), (display-mode: fullscreen)").matches) || window.navigator.standalone;
  if (!req || standalone) return; // e.g. iPhone Safari: use "Add to Home Screen" for full screen

  var ICON_IN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>';
  var ICON_OUT = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg>';
  var btn = d.createElement("button");
  btn.type = "button"; btn.className = "vm-fs";
  function sync() {
    var on = isFs();
    btn.innerHTML = on ? ICON_OUT : ICON_IN;
    btn.setAttribute("aria-label", on ? "Exit full screen" : "Enter full screen");
    btn.title = on ? "Exit full screen" : "Full screen";
  }
  function enter() { try { var r = req.call(root, { navigationUI: "hide" }); if (r && r.catch) r.catch(function () {}); } catch (e) {} }
  btn.addEventListener("click", function () { if (isFs()) exit.call(d); else enter(); });
  d.addEventListener("fullscreenchange", sync);
  d.addEventListener("webkitfullscreenchange", sync);
  sync();
  d.body.appendChild(btn);

  // Phones and tablets: go full screen automatically on the first tap anywhere.
  var touch = window.matchMedia && window.matchMedia("(pointer: coarse)").matches;
  if (touch) {
    var first = function () {
      d.removeEventListener("touchend", first, true);
      if (!isFs()) enter();
    };
    d.addEventListener("touchend", first, true);
  }
})();
</script>
