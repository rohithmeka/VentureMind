}

function buildResults() {
  const r = lastReport;
  const wrap = el("div", { class: "results" });

  if (r.founderWarnings && r.founderWarnings.length) {
    wrap.appendChild(el("div", { class: "warning-box",
      html: "<b>Heads up:</b><br>" + r.founderWarnings.map(w => "\u2022 " + w).join("<br>") }));
  }

  // -- gauge card --
  const gaugeCard = el("div", { class: "gauge-card", id: "section-verdict" });
  gaugeCard.appendChild(buildGauge(r.finalDecision.compositeConfidence, r.finalDecision.decision));
  gaugeCard.appendChild(el("div", { class: "gauge-decision " + r.finalDecision.decision, text: r.finalDecision.decision }));
  gaugeCard.appendChild(el("div", { class: "gauge-conf",
    text: "Overall confidence " + Math.round(r.finalDecision.compositeConfidence * 100) + "%" }));
  wrap.appendChild(gaugeCard);

  // -- rationale --
  const rationaleCard = el("div", { class: "card" }, [
    el("h3", { text: "Why" }),
    el("ul", { class: "rationale-list" }, r.finalDecision.rationale.map((line) => el("li", { text: line }))),
  ]);
  wrap.appendChild(rationaleCard);

  // -- opportunity --
  const co = r.chosenOpportunity;
  const oppCard = el("div", { class: "card", id: "section-opportunity" }, [
    el("div", { class: "subtle", text: "RECOMMENDED OPPORTUNITY" }),
    el("div", { class: "opp-headline", text: co.sector }),
    el("div", { class: "opp-sub", text: co.state + " \u00b7 your location: " +
      (r.founderLocation.resolvedState || (r.founderLocation.rawInput || "unspecified") + " (unresolved)") }),
    el("div", { class: "tag-row" }, co.requiredSkills.map((s) => el("span", { class: "tag", text: E.SKILL_LABELS[s] || s }))),
  ]);
  wrap.appendChild(oppCard);

  // -- score breakdown --
  const weights = E.DEFAULT_WEIGHTS;
  const compLabels = { demand: "Market demand", competition: "Low competition", founder_fit: "Fit with you",
    capital_feasibility: "Affordability", risk: "Low risk", location: "Location match" };
  const scoreCard = el("div", { class: "card", id: "section-score" }, [
    el("h3", { text: "Score breakdown" }),
    el("div", { class: "subtle", text: "Opportunity score: " + Math.round(r.evidence.opportunityScore * 100) + " / 100" }),
  ]);
  Object.keys(compLabels).forEach((k) => {
    const v = r.evidence.components[k];
    scoreCard.appendChild(el("div", { class: "bar-row" }, [
      el("div", { class: "bar-label" }, [
        el("span", { class: "name", text: compLabels[k] + " (" + Math.round(weights[k] * 100) + "% weight)" }),
        el("span", { class: "val", text: Math.round(v * 100) + "%" }),
      ]),
      el("div", { class: "bar-track" }, [el("div", { class: "bar-fill", style: "width:" + (v * 100) + "%" })]),
    ]));
  });
  wrap.appendChild(scoreCard);

  // -- resource plan --
  const palette = ["#A9812E", "#2F6B4F", "#AD7A2A", "#10142B", "#8B93C7"];
  const allocCard = el("div", { class: "card", id: "section-budget" }, [
    el("h3", { text: "Suggested budget split" }),
    el("div", { class: "subtle", text: fmtINR(r.resourcePlan.budget) + " total" +
      (r.resourcePlan.minimumsScaled ? " \u2014 minimums scaled down to fit your budget" : "") }),
  ]);
  E.CATEGORIES.forEach((cat, i) => {
    allocCard.appendChild(el("div", { class: "alloc-row" }, [
      el("div", { class: "alloc-dot", style: "background:" + palette[i] }),
      el("div", { class: "alloc-name", text: cat }),
      el("div", { class: "alloc-amt", text: fmtINR(r.resourcePlan.allocations[cat]) + " (" +
        Math.round(r.resourcePlan.fractions[cat] * 100) + "%)" }),
    ]));
  });
  wrap.appendChild(allocCard);

  // -- trend & risk --
  const trendCard = el("div", { class: "card", id: "section-trend" }, [
    el("h3", { text: "Market trend & risk" }),
    el("div", { class: "metric-grid" }, [
      el("div", { class: "metric" }, [
        el("div", { class: "m-label", text: "6-month demand trend" }),
        el("div", { class: "m-val", text: (r.trend.slope >= 0 ? "\u2191 " : "\u2193 ") + Math.abs(r.trend.slope * 100).toFixed(2) + "%/mo" }),
        el("div", { class: "m-target", text: "fit quality R\u00b2 = " + r.trend.rSquared.toFixed(2) }),
      ]),
      el("div", { class: "metric" }, [
        el("div", { class: "m-label", text: "Risk score" }),
        el("div", { class: "m-val", text: Math.round(r.risk.riskScore * 100) + "%" }),
        el("div", { class: "m-target", text: "vs. average opportunity" }),
      ]),
    ]),
  ]);
  wrap.appendChild(trendCard);

  // -- business evolution --
  const be = r.businessEvolution;
  const successPct = Math.round(be.markov.probSuccess * 100);
  const evoCard = el("div", { class: "card", id: "section-evolution" }, [
    el("h3", { text: "How this tends to play out" }),
    el("div", { class: "bar-row" }, [
      el("div", { class: "bar-label" }, [
        el("span", { class: "name", text: "Chance of reaching a stable, successful stage" }),
        el("span", { class: "val", text: successPct + "%" }),
      ]),
      el("div", { class: "bar-track" }, [el("div", { class: "bar-fill", style: "width:" + successPct + "%;background:" +
        (be.markov.probSuccess < E.MARKOV_SUCCESS_GO_FLOOR ? "var(--oxblood)" : "var(--pine)") })]),
    ]),
    el("div", { class: "subtle", style: "margin-top:10px", text: "Recommended move at each stage:" }),
  ]);
  E.STATES.slice(0, 5).forEach((s) => {
    evoCard.appendChild(el("div", { class: "stage-row" }, [
      el("span", { text: s.replace("_", " ") }),
      el("span", { class: "stage-badge " + be.mdp.policy[s], text: be.mdp.policy[s].replace("_", " ") }),
    ]));
  });
  wrap.appendChild(evoCard);

  // -- validation --
  const val = r.validation;
  const valCard = el("div", { class: "card", id: "section-validation" }, [
    el("h3", { text: "Simulated market test" }),
    el("div", { class: "subtle", text: val.simulations.toLocaleString() + " simulated attempts \u00b7 " +
      Math.round(val.kpiAchievementRate * 100) + "% hit their targets" }),
    el("div", { class: "metric-grid" }, [
      el("div", { class: "metric" }, [
        el("div", { class: "m-label", text: "Monthly customers" }),
        el("div", { class: "m-val", text: Math.round(val.meanMonthlyCustomers) }),
        el("div", { class: "m-target", text: "target \u2265 " + Math.round(val.targets.minMonthlyCustomers) }),
      ]),
      el("div", { class: "metric" }, [
        el("div", { class: "m-label", text: "Conversion rate" }),
        el("div", { class: "m-val", text: (val.meanConversionRate * 100).toFixed(1) + "%" }),
        el("div", { class: "m-target", text: "target \u2265 " + (val.targets.minConversionRate * 100).toFixed(1) + "%" }),
      ]),
      el("div", { class: "metric" }, [
        el("div", { class: "m-label", text: "Cost per customer" }),
        el("div", { class: "m-val", text: fmtINR(val.meanCacInr) }),
        el("div", { class: "m-target", text: "target \u2264 " + fmtINR(val.targets.maxCacInr) }),
      ]),
    ]),
  ]);
  wrap.appendChild(valCard);

  wrap.appendChild(el("div", { class: "disclaimer",
    text: "Every number above comes from a synthetic benchmark model running entirely on this device — no real startup outcome data was used, and nothing here predicts real-world success. Treat this as a structured way to compare options, not a guarantee." }));

  wrap.appendChild(el("button", { class: "btn btn-primary restart-btn", text: "Chart a new course",
    onclick: () => { resetState(); render(); } }));

  return wrap;
}

function resetState() {
  state.step = 0; state.skills = new Set(); state.skillsFreeText = ""; state.budget = null;
  state.location = ""; state.interests = new Set(); state.interestsFreeText = ""; state.risk = null; state.time = null;
  lastReport = null;
}

render();
})();


</script>
<script>
/* ==========================================================================
   PRESENTATION LAYER ONLY
   Watches the DOM the original render() produces and adds purely visual
   classes (entrance motion, selection pop, scroll-spy highlight) plus the
   custom pointer. It never reads or writes app state, never calls render(),
   never touches the engine, and never changes any text or value.
   ========================================================================== */
(function () {
  "use strict";
  var app = document.getElementById("app");
  if (!app) return;
  var reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  // ---------- screen-change detection -> entrance classes ----------
  var lastKey = null, lastIndex = -1, heroDone = false, lastPicked = null;

  function screenKey() {
    if (app.querySelector(".results")) return { key: "results", index: 99 };
    var lbl = app.querySelector(".step-label");
    if (!lbl) return { key: "none", index: -1 };
    var m = /(\d+)/.exec(lbl.textContent || "");
    return { key: lbl.textContent, index: m ? parseInt(m[1], 10) : 0 };
  }

  function decorate() {
    var s = screenKey();
    var hero = app.querySelector(".hero");
    if (hero && !heroDone) { hero.classList.add("vm-in"); heroDone = true; }

    if (s.key !== lastKey) {
      var body = app.querySelector(".step") || app.querySelector(".results");
      if (body) {
        body.classList.add("vm-enter");
        if (s.index < lastIndex && s.key !== "results") body.classList.add("vm-back");
      }
      if (s.index > lastIndex && s.key !== "results") {
        var dots = app.querySelectorAll(".progress .dot.done");
        if (dots.length) dots[dots.length - 1].classList.add("vm-grow");
      }
      if (s.key === "results") setupSpy();
      lastKey = s.key; lastIndex = s.index;
    } else if (lastPicked) {
      // same screen re-rendered after a pick: pop the element that just got selected
      var nodes = app.querySelectorAll(lastPicked.sel);
      for (var i = 0; i < nodes.length; i++) {
        if (nodes[i].textContent === lastPicked.text && nodes[i].classList.contains("selected")) {
          nodes[i].classList.add("vm-pop");
          break;
        }
      }
    }
    lastPicked = null;
  }

  document.addEventListener("click", function (e) {
    var t = e.target && e.target.closest ? e.target.closest(".chip, .choice-card") : null;
    if (t) lastPicked = { sel: t.classList.contains("chip") ? ".chip" : ".choice-card", text: t.textContent };
  }, true);

  new MutationObserver(function () { decorate(); }).observe(app, { childList: true });
  decorate();

  // ---------- results sidebar scroll-spy ----------
  var spyHandler = null;
  function setupSpy() {
    if (spyHandler) window.removeEventListener("scroll", spyHandler);
    var links = app.querySelectorAll(".results-nav .nav-item");
    if (!links.length) return;
    spyHandler = function () {
      var line = window.innerHeight * 0.4, current = null;
      for (var i = 0; i < links.length; i++) {
        var sec = document.getElementById(links[i].getAttribute("href").slice(1));
        if (sec && sec.getBoundingClientRect().top <= line) current = links[i];
      }
      if (!current) current = links[0];
      if ((window.innerHeight + window.scrollY) >= document.documentElement.scrollHeight - 4) current = links[links.length - 1];
      for (var j = 0; j < links.length; j++) links[j].classList.toggle("vm-active", links[j] === current);
    };
    window.addEventListener("scroll", spyHandler, { passive: true });
    spyHandler();
  }

  // ---------- pointer spotlight on cards ----------
  document.addEventListener("pointermove", function (e) {
    var c = e.target && e.target.closest ? e.target.closest(".card, .choice-card") : null;
    if (!c) return;
    var r = c.getBoundingClientRect();
    c.style.setProperty("--mx", (e.clientX - r.left) + "px");
    c.style.setProperty("--my", (e.clientY - r.top) + "px");
  }, { passive: true });

  // ---------- custom pointer ----------
  var fine = window.matchMedia && window.matchMedia("(hover: hover) and (pointer: fine)").matches;
  var cursor = document.createElement("div");
  cursor.className = "vm-cursor is-hidden";
  cursor.innerHTML = '<div class="vm-cursor-ring"></div><div class="vm-cursor-dot"></div>';
  document.body.appendChild(cursor);
  var ring = cursor.firstChild, dot = cursor.lastChild;
  var mx = -100, my = -100, rx = -100, ry = -100, running = false;

  function loop() {
    var k = reduceMotion ? 1 : 0.2;
    rx += (mx - rx) * k; ry += (my - ry) * k;
    ring.style.transform = "translate3d(" + rx + "px," + ry + "px,0)";
    if (Math.abs(mx - rx) > 0.1 || Math.abs(my - ry) > 0.1) requestAnimationFrame(loop);
    else running = false;
  }
  function kick() { if (!running) { running = true; requestAnimationFrame(loop); } }

  function refreshHover(target) {
    var interactive = target && target.closest ? target.closest("button, a, .chip, .choice-card, [role=button]") : null;
    var text = target && target.closest ? target.closest("input, textarea") : null;
    cursor.classList.toggle("is-hover", !!interactive && !interactive.disabled);
    cursor.classList.toggle("is-disabled", !!interactive && !!interactive.disabled);
    cursor.classList.toggle("is-text", !!text);
  }

  if (fine) {
    document.addEventListener("mousemove", function (e) {
      document.documentElement.classList.add("vm-pointer");
      cursor.classList.remove("is-hidden");
      mx = e.clientX; my = e.clientY;
      dot.style.transform = "translate3d(" + mx + "px," + my + "px,0)";
      refreshHover(e.target);
      kick();
    }, { passive: true });
    document.addEventListener("mouseleave", function () { cursor.classList.add("is-hidden"); });
    document.documentElement.addEventListener("mouseleave", function () { cursor.classList.add("is-hidden"); });
    document.addEventListener("mousedown", function () { cursor.classList.add("is-down"); });
    document.addEventListener("mouseup", function () {
      cursor.classList.remove("is-down");
      // the element under the pointer may have been re-rendered; re-check what's there now
      setTimeout(function () { refreshHover(document.elementFromPoint(mx, my)); }, 0);
    });
  }

  // ---------- click burst (selection feedback, mouse and touch) ----------
  var COLORS = ["#FFB23F", "#FF4F8B", "#19C6B7", "#FFF3E4"];
  document.addEventListener("pointerdown", function (e) {
    if (reduceMotion) return;
    var t = e.target && e.target.closest ? e.target.closest(".chip, .choice-card, .btn:not(:disabled)") : null;
    if (!t) return;
    var x = e.clientX, y = e.clientY;
    var rip = document.createElement("div");
    rip.className = "vm-ripple";
    rip.style.left = x + "px"; rip.style.top = y + "px";
    document.body.appendChild(rip);
    setTimeout(function () { rip.remove(); }, 650);
    var willSelect = !t.classList.contains("selected");
    if (!willSelect || t.classList.contains("btn")) return;
    for (var i = 0; i < 9; i++) {
      var s = document.createElement("div");
      s.className = "vm-spark";
      var a = (Math.PI * 2 * i) / 9 + Math.random() * 0.5;
      var d = 26 + Math.random() * 22;
      s.style.left = x + "px"; s.style.top = y + "px";
      s.style.background = COLORS[i % COLORS.length];
      s.style.boxShadow = "0 0 8px " + COLORS[i % COLORS.length];
      s.style.setProperty("--dx", Math.cos(a) * d + "px");
      s.style.setProperty("--dy", Math.sin(a) * d + "px");
      document.body.appendChild(s);
      (function (n) { setTimeout(function () { n.remove(); }, 650); })(s);
    }
  }, { passive: true });
})();
</script>
<script>
/* Full-screen support (presentation only; does not touch app state). */
(function () {
  "use strict";
  var d = document, root = d.documentElement;
  var req = root.requestFullscreen || root.webkitRequestFullscreen;
  var exit = d.exitFullscreen || d.webkitExitFullscreen;
  function isFs() { return !!(d.fullscreenElement || d.webkitFullscreenElement); }
  var standalone = (window.matchMedia && window.matchMedia("(display-mode: standalone), (display-mode: fullscreen)").matches) || window.navigator.standalone;
  if (!req || standalone) return; // e.g. iPhone Safari: use "Add to Home Screen" for full screen

  var ICON_IN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>';
  var ICON_OUT = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg>';
  var btn = d.createElement("button");
  btn.type = "button"; btn.className = "vm-fs";
  function sync() {
    var on = isFs();
    btn.innerHTML = on ? ICON_OUT : ICON_IN;
    btn.setAttribute("aria-label", on ? "Exit full screen" : "Enter full screen");
    btn.title = on ? "Exit full screen" : "Full screen";
  }
  function enter() { try { var r = req.call(root, { navigationUI: "hide" }); if (r && r.catch) r.catch(function () {}); } catch (e) {} }
  btn.addEventListener("click", function () { if (isFs()) exit.call(d); else enter(); });
  d.addEventListener("fullscreenchange", sync);
  d.addEventListener("webkitfullscreenchange", sync);
  sync();
  d.body.appendChild(btn);

  // Phones and tablets: go full screen automatically on the first tap anywhere.
  var touch = window.matchMedia && window.matchMedia("(pointer: coarse)").matches;
  if (touch) {
    var first = function () {
      d.removeEventListener("touchend", first, true);
      if (!isFs()) enter();
    };
    d.addEventListener("touchend", first, true);
  }
})();
</script>
